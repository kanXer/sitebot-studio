<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rivafyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="rivafyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#070A12"/>
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#rivafyGrad)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Rivafy 'R' Emblem with Build. Embed. Automate Nodes -->
  <g filter="url(#rivafyGlow)">
    <!-- Vertical Spine of 'R' -->
    <rect x="16" y="14" width="6.5" height="36" rx="3.25" fill="url(#stemGrad)"/>
    
    <!-- Upper Loop of 'R' -->
    <path d="M19 14H33C39.075 14 44 18.925 44 25C44 31.075 39.075 36 33 36H19" 
          stroke="url(#rivafyGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Diagonal Leg of 'R' (Automate Thrust) -->
    <path d="M29 33L42.5 48.5" 
          stroke="url(#rivafyGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Tri-Nodes representing: Build, Embed, Automate -->
    <!-- Node 1: Build (Top Cyan) -->
    <circle cx="33" cy="25" r="2.2" fill="#38BDF8"/>
    <!-- Node 2: Embed (Center Violet Core) -->
    <circle cx="43.5" cy="25" r="2.2" fill="#C084FC"/>
    <!-- Node 3: Automate (Forward Spark Pink) -->
    <circle cx="43" cy="49" r="2.2" fill="#F472B6"/>
  </g>
</svg>
